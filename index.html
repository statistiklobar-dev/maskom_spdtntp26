<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Master Komoditas SPDT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #111827; color: #f9fafb; }
        .slide-in { animation: slideIn 0.3s forwards ease-out; }
        @keyframes slideIn { from { transform: translateX(20px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        /* Hide scrollbar for clean look */
        ::-webkit-scrollbar { width: 0px; background: transparent; }
    </style>
</head>
<body class="antialiased h-screen flex justify-center">

    <!-- Mobile App Container -->
    <div class="w-full max-w-md bg-gray-900 h-full flex flex-col shadow-2xl relative overflow-hidden">
        
        <!-- Header -->
        <header class="pt-10 pb-4 px-5 bg-gray-900 sticky top-0 z-10 border-b border-gray-800">
            <h1 class="text-xl font-bold tracking-wide">Master Komoditas</h1>
            <p class="text-xs text-gray-400 mt-1">SPDT NTP 2026</p>
            
            <!-- Search Bar -->
            <div class="mt-4 relative">
                <i class="fas fa-search absolute left-4 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                <input type="text" id="searchInput" placeholder="Cari kode/kata kunci..." 
                    class="w-full bg-gray-800 text-white text-sm rounded-full py-3 pl-10 pr-4 focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all">
            </div>
        </header>

        <!-- Breadcrumb / Back Button -->
        <div id="breadcrumb" class="px-5 py-3 bg-gray-800/50 text-sm text-blue-400 hidden items-center gap-2 cursor-pointer border-b border-gray-800">
            <i class="fas fa-arrow-left"></i>
            <span id="breadcrumbText" class="truncate">Kembali</span>
        </div>

        <!-- Content Area -->
        <main class="flex-1 overflow-y-auto relative" id="contentArea">
            <!-- Loading State -->
            <div id="loading" class="flex flex-col items-center justify-center h-full text-gray-500">
                <i class="fas fa-spinner fa-spin text-3xl mb-3"></i>
                <p>Memuat Data KBLI...</p>
            </div>
            
            <!-- List Container -->
            <ul id="listContainer" class="pb-10"></ul>
        </main>
    </div>

    <script>
        // ======= KONFIGURASI API =======
        const API_URL = 'https://script.google.com/macros/s/AKfycbxyYYGUXpUUShpntxrddFSol7Z_PZjNqth8z0mrlwRukcQATFKIHQztu6yK4_wT44qH/exec'; 

        // State Management
        let rawData = [];
        let isSearching = false;
        
        // Urutan hierarki kolom
        const levels = ['Divisi', 'Sub Divisi', 'Kelas', 'Subkelas', 'Komoditas'];
        let currentPath = []; // Menyimpan history klik user

        // DOM Elements
        const listContainer = document.getElementById('listContainer');
        const loading = document.getElementById('loading');
        const breadcrumb = document.getElementById('breadcrumb');
        const breadcrumbText = document.getElementById('breadcrumbText');
        const searchInput = document.getElementById('searchInput');

        // Fetch Data saat pertama kali load
        async function fetchData() {
            try {
                const response = await fetch(API_URL);
                const json = await response.json();
                if(json.status === 'success') {
                    rawData = json.data;
                    loading.style.display = 'none';
                    renderLevel(); // Render Level 0 (Divisi)
                }
            } catch (error) {
                loading.innerHTML = '<i class="fas fa-exclamation-triangle text-red-500 text-3xl mb-3"></i><p>Gagal memuat data.</p>';
            }
        }

        // Fungsi Render List (Eksplorasi)
        function renderLevel() {
            listContainer.innerHTML = '';
            isSearching = false;
            
            let currentDepth = currentPath.length; // 0=Divisi, 1=Sub, dst.
            
            // Update UI Breadcrumb
            if(currentDepth === 0) {
                breadcrumb.classList.add('hidden');
                breadcrumb.classList.remove('flex');
            } else {
                breadcrumb.classList.remove('hidden');
                breadcrumb.classList.add('flex');
                breadcrumbText.innerText = currentPath[currentDepth - 1].value;
            }

            // Filter data berdasarkan path yang sudah dipilih sebelumnya
            let filteredData = rawData;
            for(let i = 0; i < currentDepth; i++) {
                filteredData = filteredData.filter(row => row[levels[i]] === currentPath[i].value);
            }

            // Jika kita sudah sampai di level Subkelas, tampilkan Komoditas
            if(currentDepth === levels.length - 1) {
                renderKomoditasList(filteredData);
                return;
            }

            // Ambil nilai unik untuk level saat ini
            const currentColumnName = levels[currentDepth];
            const uniqueItems = [...new Set(filteredData.map(item => item[currentColumnName]))].filter(Boolean);

            // Tampilkan list ke UI
            uniqueItems.forEach(item => {
                const li = document.createElement('li');
                li.className = 'slide-in border-b border-gray-800 hover:bg-gray-800 transition-colors cursor-pointer p-5 flex justify-between items-center group';
                li.innerHTML = `
                    <span class="text-sm font-medium pr-4 leading-relaxed">${item}</span>
                    <i class="fas fa-chevron-right text-gray-600 group-hover:text-blue-400 text-xs"></i>
                `;
                li.onclick = () => {
                    currentPath.push({ level: currentColumnName, value: item });
                    searchInput.value = ''; // Reset pencarian
                    renderLevel();
                };
                listContainer.appendChild(li);
            });
        }

        // Render List Level Akhir (Komoditas)
        function renderKomoditasList(dataToRender) {
            listContainer.innerHTML = '';
            
            // Hindari duplikasi jika pencarian memunculkan item yang sama
            const uniqueKomoditas = [];
            const seen = new Set();
            dataToRender.forEach(item => {
                if(!seen.has(item.GEN_KD_SPDT26)) {
                    seen.add(item.GEN_KD_SPDT26);
                    uniqueKomoditas.push(item);
                }
            });

            if(uniqueKomoditas.length === 0) {
                listContainer.innerHTML = '<div class="p-5 text-center text-gray-500 text-sm">Data tidak ditemukan</div>';
                return;
            }

            uniqueKomoditas.forEach(item => {
                const li = document.createElement('li');
                li.className = 'slide-in border-b border-gray-800 hover:bg-gray-800 transition-colors cursor-pointer p-5 flex flex-col group';
                
                // Format: KODE - NAMA KOMODITAS
                li.innerHTML = `
                    <div class="flex items-start gap-3">
                        <div class="bg-gray-800 group-hover:bg-blue-900/50 px-2 py-1 rounded text-xs font-mono text-blue-300 whitespace-nowrap mt-0.5">
                            ${item.GEN_KD_SPDT26}
                        </div>
                        <div class="text-sm font-medium leading-relaxed flex-1">${item.NAMA_KOM_SPDT26}</div>
                    </div>
                `;
                
                li.onclick = () => showDetail(item);
                listContainer.appendChild(li);
            });
        }

        // Tampilkan Modal Detail Satuan
        function showDetail(item) {
            // Kita render tampilan detail menggantikan list
            listContainer.innerHTML = `
                <div class="p-5 slide-in">
                    <div class="bg-gray-800 rounded-xl p-6 border border-gray-700 shadow-lg relative">
                        <span class="absolute top-4 right-4 text-xs font-semibold bg-blue-900/50 text-blue-300 px-3 py-1 rounded-full border border-blue-800">
                            KOMODITAS
                        </span>
                        
                        <h2 class="text-xl font-bold text-white mb-2 mt-4 pr-16">${item.NAMA_KOM_SPDT26}</h2>
                        
                        <div class="grid grid-cols-1 gap-4 mt-6">
                            <div class="bg-gray-900/50 p-4 rounded-lg border border-gray-700/50">
                                <p class="text-xs text-gray-400 mb-1 uppercase tracking-wider">Kode KBLI / SPDT</p>
                                <p class="font-mono text-lg text-blue-400">${item.GEN_KD_SPDT26}</p>
                            </div>
                            
                            <div class="bg-gray-900/50 p-4 rounded-lg border border-gray-700/50">
                                <p class="text-xs text-gray-400 mb-1 uppercase tracking-wider">Satuan</p>
                                <p class="font-medium text-lg text-green-400">${item.SATUAN || 'Tidak Ada Satuan'}</p>
                            </div>
                        </div>
                        
                        <!-- Hierarki Detail -->
                        <div class="mt-6 pt-5 border-t border-gray-700 text-xs text-gray-400 space-y-2">
                            <p><b>Divisi:</b> ${item['Divisi']}</p>
                            <p><b>Sub Divisi:</b> ${item['Sub Divisi']}</p>
                            <p><b>Kelas:</b> ${item['Kelas']}</p>
                            <p><b>Subkelas:</b> ${item['Subkelas']}</p>
                        </div>
                    </div>
                </div>
            `;
            
            // Ubah breadcrumb agar bisa kembali
            breadcrumb.classList.remove('hidden');
            breadcrumb.classList.add('flex');
            breadcrumbText.innerText = "Kembali ke Daftar";
        }

        // Fitur Pencarian (Live Search)
        searchInput.addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase().trim();
            if(query.length === 0) {
                if(isSearching) {
                    renderLevel(); // Kembali ke hierarki sebelumnya
                }
                return;
            }

            isSearching = true;
            breadcrumb.classList.add('hidden');
            breadcrumb.classList.remove('flex');
            
            const results = rawData.filter(item => {
                const kode = (item.GEN_KD_SPDT26 || '').toLowerCase();
                const nama = (item.NAMA_KOM_SPDT26 || '').toLowerCase();
                return kode.includes(query) || nama.includes(query);
            });

            renderKomoditasList(results);
        });

        // Event Tombol Kembali (Breadcrumb)
        breadcrumb.addEventListener('click', () => {
            if (isSearching) {
                // Jika sedang mencari dan mengklik detail, reset pencarian
                searchInput.value = '';
                renderLevel();
            } else {
                // Navigasi mundur pada hierarki
                currentPath.pop();
                renderLevel();
            }
        });

        // Inisiasi
        fetchData();
    </script>
</body>
</html>
