<!DOCTYPE html>
<html lang="id" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Master SPDT NTP 2026</title>
    <!-- Tailwind & Config for Dark Mode -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: { 50: '#f0fdf4', 100: '#dcfce7', 500: '#22c55e', 600: '#16a34a', 900: '#14532d' } 
                    }
                }
            }
        }
    </script>
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; transition: background-color 0.3s, color 0.3s; }
        .slide-in { animation: slideIn 0.3s forwards ease-out; }
        @keyframes slideIn { from { transform: translateY(15px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 10px; }
        .dark ::-webkit-scrollbar-thumb { background-color: #334155; }
        .glass-effect { backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
    </style>
</head>
<body class="bg-gray-50 dark:bg-gray-950 text-gray-800 dark:text-gray-100 min-h-screen flex justify-center antialiased transition-colors duration-300">

    <!-- Responsive Container -->
    <div class="w-full max-w-5xl md:my-8 md:rounded-3xl bg-white dark:bg-gray-900 md:shadow-2xl md:border border-gray-200 dark:border-gray-800 flex flex-col relative overflow-hidden h-screen md:h-[90vh]">
        
        <!-- Header -->
        <header class="pt-8 pb-5 px-6 md:px-10 bg-white/90 dark:bg-gray-900/90 glass-effect sticky top-0 z-20 border-b border-gray-200 dark:border-gray-800 transition-colors">
            <div class="flex justify-between items-start gap-4">
                <div class="flex items-start gap-4">
                    <!-- Logo Icon -->
                    <div class="w-12 h-12 rounded-xl bg-brand-500 text-white flex items-center justify-center shadow-lg shadow-brand-500/30 flex-shrink-0">
                        <i class="fa-solid fa-wheat-awn text-2xl"></i>
                    </div>
                    <div>
                        <h1 class="text-xl md:text-2xl font-bold leading-tight dark:text-white text-gray-900">Master Komoditas SPDT NTP 2026</h1>
                        <p class="text-xs md:text-sm text-gray-500 dark:text-gray-400 mt-1.5 leading-relaxed max-w-2xl">
                            Survei Penyempurnaan Diagram Timbang Nilai Tukar Petani 2026
                        </p>
                    </div>
                </div>
                <!-- Theme Toggle -->
                <button id="themeToggle" class="w-10 h-10 rounded-full bg-gray-100 dark:bg-gray-800 flex items-center justify-center text-gray-600 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-700 transition flex-shrink-0">
                    <i class="fa-solid fa-moon" id="themeIcon"></i>
                </button>
            </div>
            
            <!-- Search Bar -->
            <div class="mt-6 relative group max-w-2xl">
                <i class="fas fa-search absolute left-4 top-1/2 transform -translate-y-1/2 text-gray-400 group-focus-within:text-brand-500 transition-colors"></i>
                <input type="text" id="searchInput" placeholder="Cari kode atau nama komoditas..." 
                    class="w-full bg-gray-50 dark:bg-gray-800/50 text-gray-800 dark:text-gray-100 text-sm md:text-base rounded-xl py-3.5 pl-12 pr-4 border border-gray-200 dark:border-gray-700 focus:outline-none focus:ring-2 focus:ring-brand-500/50 transition-all placeholder-gray-400">
            </div>
        </header>

        <!-- Breadcrumb / Back Button -->
        <div id="breadcrumb" class="px-6 md:px-10 py-3.5 bg-brand-50/50 dark:bg-brand-900/10 text-sm text-brand-700 dark:text-brand-400 hidden items-center gap-3 cursor-pointer border-b border-brand-100 dark:border-brand-900/30 hover:bg-brand-50 dark:hover:bg-brand-900/20 transition-colors">
            <div class="bg-white dark:bg-gray-800 w-7 h-7 rounded-full flex items-center justify-center shadow-sm border border-brand-100 dark:border-gray-700">
                <i class="fas fa-arrow-left text-xs"></i>
            </div>
            <span id="breadcrumbText" class="font-semibold truncate">Kembali</span>
        </div>

        <!-- Content Area -->
        <main class="flex-1 overflow-y-auto relative p-4 md:p-8 bg-gray-50 dark:bg-gray-950/50" id="contentArea">
            <!-- Loading State -->
            <div id="loading" class="flex flex-col items-center justify-center h-full text-gray-500 dark:text-gray-400">
                <div class="w-12 h-12 border-4 border-brand-200 border-t-brand-500 rounded-full animate-spin mb-4"></div>
                <p class="font-medium text-center">Sinkronisasi Master Komoditas SPDT NTP 2026...</p>
            </div>
            
            <!-- List Container -->
            <ul id="listContainer" class="pb-10 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3 md:gap-4"></ul>
        </main>
    </div>

    <script>
        // ======= KONFIGURASI API =======
        const API_URL = 'https://script.google.com/macros/s/AKfycbxyYYGUXpUUShpntxrddFSol7Z_PZjNqth8z0mrlwRukcQATFKIHQztu6yK4_wT44qH/exec'; 

        // ======= LIGHT/DARK MODE LOGIC =======
        const htmlEl = document.documentElement;
        const themeToggleBtn = document.getElementById('themeToggle');
        const themeIcon = document.getElementById('themeIcon');

        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            htmlEl.classList.add('dark');
            themeIcon.classList.replace('fa-moon', 'fa-sun');
        } else {
            htmlEl.classList.remove('dark');
            themeIcon.classList.replace('fa-sun', 'fa-moon');
        }

        themeToggleBtn.addEventListener('click', () => {
            htmlEl.classList.toggle('dark');
            if (htmlEl.classList.contains('dark')) {
                localStorage.theme = 'dark';
                themeIcon.classList.replace('fa-moon', 'fa-sun');
            } else {
                localStorage.theme = 'light';
                themeIcon.classList.replace('fa-sun', 'fa-moon');
            }
        });


        // ======= APP LOGIC =======
        let rawData = [];
        let isSearching = false;
        let currentPath = []; 

        const listContainer = document.getElementById('listContainer');
        const loading = document.getElementById('loading');
        const breadcrumb = document.getElementById('breadcrumb');
        const breadcrumbText = document.getElementById('breadcrumbText');
        const searchInput = document.getElementById('searchInput');

        // Fungsi Penentu Hierarki Dinamis
        function getActiveLevels() {
            if (currentPath.length === 0) return ['Jenis', 'Divisi', 'Sub Divisi', 'Komoditas']; // Default
            
            const jenisAktif = currentPath[0].value;
            if (jenisAktif === '1. KONSUMSI') {
                return ['Jenis', 'Divisi', 'Sub Divisi', 'Kelas', 'Subkelas', 'Komoditas'];
            } else {
                return ['Jenis', 'Divisi', 'Sub Divisi', 'Komoditas']; 
            }
        }

        async function fetchData() {
            try {
                const response = await fetch(API_URL);
                const json = await response.json();
                if(json.status === 'success') {
                    rawData = json.data;
                    loading.style.display = 'none';
                    renderLevel(); 
                }
            } catch (error) {
                loading.innerHTML = '<i class="fas fa-wifi text-red-500 text-3xl mb-3"></i><p>Gagal memuat data. Periksa koneksi.</p>';
            }
        }

        function renderLevel() {
            listContainer.innerHTML = '';
            listContainer.className = 'pb-10 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3 md:gap-4'; 
            isSearching = false;
            
            const activeLevels = getActiveLevels();
            let currentDepth = currentPath.length; 
            
            if(currentDepth === 0) {
                breadcrumb.classList.add('hidden');
                breadcrumb.classList.remove('flex');
            } else {
                breadcrumb.classList.remove('hidden');
                breadcrumb.classList.add('flex');
                breadcrumbText.innerText = `Kembali ke ${currentPath[currentDepth - 1].value}`;
            }

            let filteredData = rawData;
            for(let i = 0; i < currentDepth; i++) {
                filteredData = filteredData.filter(row => row[activeLevels[i]] === currentPath[i].value);
            }

            if(currentDepth === activeLevels.length - 1) {
                renderKomoditasList(filteredData);
                return;
            }

            const currentColumnName = activeLevels[currentDepth];
            const uniqueItems = [...new Set(filteredData.map(item => item[currentColumnName]))].filter(Boolean);

            uniqueItems.forEach((item, idx) => {
                const li = document.createElement('li');
                li.style.animationDelay = `${idx * 0.03}s`;
                li.className = 'slide-in opacity-0 bg-white dark:bg-gray-800/80 border border-gray-200 dark:border-gray-700/50 rounded-2xl hover:shadow-lg hover:border-brand-500 dark:hover:border-brand-500 transition-all cursor-pointer p-5 flex justify-between items-center group';
                
                let iconClass = currentDepth === 0 ? 'fa-layer-group text-blue-500' : 'fa-folder-open text-amber-500';

                li.innerHTML = `
                    <div class="flex items-start gap-4">
                        <div class="w-10 h-10 rounded-xl bg-gray-100 dark:bg-gray-900 flex items-center justify-center flex-shrink-0 group-hover:scale-110 transition-transform">
                            <i class="fa-solid ${iconClass} text-base opacity-80"></i>
                        </div>
                        <span class="text-sm font-semibold text-gray-800 dark:text-gray-200 leading-relaxed pr-2 mt-2">${item}</span>
                    </div>
                    <div class="w-7 h-7 rounded-full bg-gray-50 dark:bg-gray-700 flex items-center justify-center group-hover:bg-brand-100 dark:group-hover:bg-brand-900/50 transition-colors flex-shrink-0">
                        <i class="fas fa-chevron-right text-gray-400 group-hover:text-brand-500 text-xs"></i>
                    </div>
                `;
                li.onclick = () => {
                    currentPath.push({ level: currentColumnName, value: item });
                    searchInput.value = ''; 
                    renderLevel();
                };
                listContainer.appendChild(li);
            });
        }

        function renderKomoditasList(dataToRender) {
            listContainer.innerHTML = '';
            listContainer.className = 'pb-10 grid grid-cols-1 md:grid-cols-2 gap-3 md:gap-4'; 
            
            const uniqueKomoditas = [];
            const seen = new Set();
            dataToRender.forEach(item => {
                if(!seen.has(item.GEN_KD_SPDT26)) {
                    seen.add(item.GEN_KD_SPDT26);
                    uniqueKomoditas.push(item);
                }
            });

            if(uniqueKomoditas.length === 0) {
                listContainer.className = 'pb-10 block';
                listContainer.innerHTML = `
                    <div class="p-10 mt-10 text-center text-gray-500 flex flex-col items-center bg-white dark:bg-gray-800/50 rounded-2xl border border-dashed border-gray-300 dark:border-gray-700">
                        <i class="fa-solid fa-box-open text-4xl mb-4 opacity-40"></i>
                        <p class="text-base font-medium">Data tidak ditemukan</p>
                        <p class="text-sm mt-1 opacity-70">Coba gunakan kata kunci lain</p>
                    </div>`;
                return;
            }

            uniqueKomoditas.forEach((item, idx) => {
                const li = document.createElement('li');
                li.style.animationDelay = `${idx * 0.03}s`;
                li.className = 'slide-in opacity-0 bg-white dark:bg-gray-800/80 border border-gray-200 dark:border-gray-700/50 rounded-2xl hover:shadow-lg hover:border-brand-500 transition-all cursor-pointer p-5 flex flex-col group';
                
                li.innerHTML = `
                    <div class="flex items-start gap-4">
                        <div class="bg-gray-100 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 group-hover:border-brand-500 group-hover:bg-brand-50 dark:group-hover:bg-brand-900/30 group-hover:text-brand-600 dark:group-hover:text-brand-400 px-2.5 py-1.5 rounded-lg text-xs font-mono font-bold text-gray-600 dark:text-gray-300 whitespace-nowrap transition-all shadow-sm">
                            ${item.GEN_KD_SPDT26}
                        </div>
                        <div class="text-sm font-semibold text-gray-800 dark:text-gray-100 leading-relaxed flex-1">${item.NAMA_KOM_SPDT26}</div>
                    </div>
                `;
                
                li.onclick = () => showDetail(item);
                listContainer.appendChild(li);
            });
        }

        function showDetail(item) {
            listContainer.className = 'pb-10 block max-w-3xl mx-auto w-full'; 
            
            // Generate List Hierarki (Hanya Value) secara Dinamis
            let hierarkiHTML = '';
            const hierarkiLevels = ['Jenis', 'Divisi', 'Sub Divisi', 'Kelas', 'Subkelas'];
            
            hierarkiLevels.forEach(level => {
                if (item[level] && item[level].toString().trim() !== '') {
                    hierarkiHTML += `<HierarchyRow value="${item[level]}" />\n`;
                }
            });

            listContainer.innerHTML = `
                <div class="slide-in">
                    <div class="bg-white dark:bg-gray-800/90 rounded-3xl p-6 md:p-8 border border-gray-200 dark:border-gray-700 shadow-xl relative overflow-hidden">
                        
                        <!-- Background Accent -->
                        <div class="absolute -right-10 -top-10 w-40 h-40 bg-brand-500/10 rounded-full blur-3xl pointer-events-none"></div>

                        <div class="w-14 h-14 rounded-2xl bg-brand-100 dark:bg-brand-900/40 text-brand-600 dark:text-brand-400 flex items-center justify-center mb-5 shadow-inner">
                            <i class="fa-solid fa-box text-2xl"></i>
                        </div>

                        <span class="absolute top-8 right-8 text-[10px] md:text-xs font-bold bg-brand-50 dark:bg-gray-900 text-brand-600 dark:text-brand-400 px-3 md:px-4 py-1.5 rounded-full border border-brand-200 dark:border-gray-700 uppercase tracking-wider shadow-sm">
                            Komoditas
                        </span>
                        
                        <h2 class="text-xl md:text-2xl font-bold text-gray-900 dark:text-white mb-8 pr-20 leading-snug">${item.NAMA_KOM_SPDT26}</h2>
                        
                        <div class="grid grid-cols-2 gap-4 mb-8">
                            <div class="bg-gray-50 dark:bg-gray-900/60 p-5 rounded-2xl border border-gray-100 dark:border-gray-700/50 shadow-sm">
                                <p class="text-[10px] md:text-xs font-bold text-gray-400 dark:text-gray-500 mb-2 uppercase tracking-wider">Kode SPDT</p>
                                <p class="font-mono text-base md:text-lg font-bold text-gray-800 dark:text-gray-200">${item.GEN_KD_SPDT26}</p>
                            </div>
                            
                            <div class="bg-gray-50 dark:bg-gray-900/60 p-5 rounded-2xl border border-gray-100 dark:border-gray-700/50 shadow-sm">
                                <p class="text-[10px] md:text-xs font-bold text-gray-400 dark:text-gray-500 mb-2 uppercase tracking-wider">Satuan</p>
                                <p class="font-bold text-base md:text-lg text-brand-600 dark:text-brand-400">${item.SATUAN || '-'}</p>
                            </div>
                        </div>
                        
                        <!-- List Hasil Isian Kolom -->
                        <div class="pt-6 border-t border-gray-100 dark:border-gray-700/80">
                            <div class="space-y-4 relative before:absolute before:inset-y-0 before:left-[11px] md:before:left-[15px] before:w-[2px] before:bg-gray-200 dark:before:bg-gray-700 ml-1 md:ml-0">
                                ${hierarkiHTML}
                            </div>
                        </div>
                    </div>
                </div>
            `;
            
            // Helper replace khusus untuk list value murni (tanpa label)
            listContainer.innerHTML = listContainer.innerHTML.replace(/<HierarchyRow value="(.*?)" \/>/g, 
                `<div class="relative pl-8 md:pl-10 group">
                    <div class="absolute left-[-1px] md:left-[3px] top-1 w-[24px] h-[24px] rounded-full bg-white dark:bg-gray-800 border-2 border-brand-500 z-10 flex items-center justify-center group-hover:scale-110 transition-transform shadow-sm">
                        <div class="w-2 h-2 rounded-full bg-brand-500"></div>
                    </div>
                    <p class="text-sm md:text-base font-semibold text-gray-800 dark:text-gray-200 leading-relaxed py-0.5">$1</p>
                </div>`
            );

            breadcrumb.classList.remove('hidden');
            breadcrumb.classList.add('flex');
            breadcrumbText.innerText = "Kembali ke Daftar";
        }

        // Live Search Logic
        searchInput.addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase().trim();
            if(query.length === 0) {
                if(isSearching) {
                    currentPath = [];
                    renderLevel(); 
                }
                return;
            }

            isSearching = true;
            breadcrumb.classList.add('hidden');
            breadcrumb.classList.remove('flex');
            
            const results = rawData.filter(item => {
                const kode = (item.GEN_KD_SPDT26 || '').toLowerCase();
                const nama = (item.NAMA_KOM_SPDT26 || '').toLowerCase();
                return kode.includes(query) || nama.includes(query);
            });

            renderKomoditasList(results);
        });

        // Breadcrumb Click Event
        breadcrumb.addEventListener('click', () => {
            if (isSearching) {
                searchInput.value = '';
                currentPath = []; 
                renderLevel();
            } else {
                currentPath.pop();
                renderLevel();
            }
        });

        fetchData();
    </script>
</body>
</html>
