<!DOCTYPE html>
<html lang="id" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Master SPDT NTP 2026</title>
    <!-- Tailwind & Config for Dark Mode -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: { 50: '#f0fdf4', 100: '#dcfce7', 500: '#22c55e', 600: '#16a34a', 900: '#14532d' } // Tema hijau pertanian
                    }
                }
            }
        }
    </script>
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; transition: background-color 0.3s, color 0.3s; }
        .slide-in { animation: slideIn 0.3s forwards ease-out; }
        @keyframes slideIn { from { transform: translateX(15px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        /* Hide scrollbar for neatness */
        ::-webkit-scrollbar { width: 0px; background: transparent; }
        .glass-effect { backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
    </style>
</head>
<body class="bg-gray-100 dark:bg-gray-950 text-gray-800 dark:text-gray-100 h-screen flex justify-center antialiased">

    <!-- Mobile Frame -->
    <div class="w-full max-w-md bg-white dark:bg-gray-900 h-full flex flex-col shadow-2xl relative overflow-hidden transition-colors duration-300">
        
        <!-- Header -->
        <header class="pt-8 pb-4 px-5 bg-white/90 dark:bg-gray-900/90 glass-effect sticky top-0 z-20 border-b border-gray-200 dark:border-gray-800 transition-colors">
            <div class="flex justify-between items-start">
                <div class="flex items-center gap-3">
                    <!-- Logo Icon -->
                    <div class="w-10 h-10 rounded-xl bg-brand-500 text-white flex items-center justify-center shadow-lg shadow-brand-500/30">
                        <i class="fa-solid fa-wheat-awn text-xl"></i>
                    </div>
                    <div>
                        <h1 class="text-lg font-bold leading-tight dark:text-white text-gray-900">Master Komoditas</h1>
                        <p class="text-xs font-semibold text-brand-600 dark:text-brand-500 flex items-center gap-1">
                            <i class="fa-solid fa-chart-line"></i> SPDT NTP 2026
                        </p>
                    </div>
                </div>
                <!-- Theme Toggle Button -->
                <button id="themeToggle" class="w-8 h-8 rounded-full bg-gray-100 dark:bg-gray-800 flex items-center justify-center text-gray-600 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-700 transition">
                    <i class="fa-solid fa-moon" id="themeIcon"></i>
                </button>
            </div>
            
            <!-- Search Bar -->
            <div class="mt-5 relative group">
                <i class="fas fa-search absolute left-4 top-1/2 transform -translate-y-1/2 text-gray-400 group-focus-within:text-brand-500 transition-colors"></i>
                <input type="text" id="searchInput" placeholder="Cari kode atau komoditas..." 
                    class="w-full bg-gray-50 dark:bg-gray-800 text-gray-800 dark:text-gray-100 text-sm rounded-xl py-3 pl-11 pr-4 border border-gray-200 dark:border-gray-700 focus:outline-none focus:ring-2 focus:ring-brand-500/50 transition-all placeholder-gray-400">
            </div>
        </header>

        <!-- Breadcrumb / Back Button -->
        <div id="breadcrumb" class="px-5 py-3 bg-brand-50 dark:bg-brand-900/20 text-sm text-brand-700 dark:text-brand-400 hidden items-center gap-2 cursor-pointer border-b border-brand-100 dark:border-brand-900/30 transition-colors">
            <div class="bg-brand-100 dark:bg-brand-800/50 w-6 h-6 rounded-full flex items-center justify-center">
                <i class="fas fa-arrow-left text-xs"></i>
            </div>
            <span id="breadcrumbText" class="font-medium truncate">Kembali</span>
        </div>

        <!-- Content Area -->
        <main class="flex-1 overflow-y-auto relative" id="contentArea">
            <!-- Loading State -->
            <div id="loading" class="flex flex-col items-center justify-center h-full text-gray-400 dark:text-gray-500">
                <div class="w-12 h-12 border-4 border-brand-200 border-t-brand-500 rounded-full animate-spin mb-4"></div>
                <p class="font-medium">Sinkronisasi Data KBLI...</p>
            </div>
            
            <!-- List Container -->
            <ul id="listContainer" class="pb-10 divide-y divide-gray-100 dark:divide-gray-800/60"></ul>
        </main>
    </div>

    <script>
        // ======= KONFIGURASI API =======
        const API_URL = 'https://script.google.com/macros/s/AKfycbxyYYGUXpUUShpntxrddFSol7Z_PZjNqth8z0mrlwRukcQATFKIHQztu6yK4_wT44qH/exec'; 

        // ======= LIGHT/DARK MODE LOGIC =======
        const htmlEl = document.documentElement;
        const themeToggleBtn = document.getElementById('themeToggle');
        const themeIcon = document.getElementById('themeIcon');

        // Check local storage or system preference
        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            htmlEl.classList.add('dark');
            themeIcon.classList.replace('fa-moon', 'fa-sun');
        } else {
            htmlEl.classList.remove('dark');
            themeIcon.classList.replace('fa-sun', 'fa-moon');
        }

        themeToggleBtn.addEventListener('click', () => {
            htmlEl.classList.toggle('dark');
            if (htmlEl.classList.contains('dark')) {
                localStorage.theme = 'dark';
                themeIcon.classList.replace('fa-moon', 'fa-sun');
            } else {
                localStorage.theme = 'light';
                themeIcon.classList.replace('fa-sun', 'fa-moon');
            }
        });


        // ======= APP LOGIC =======
        let rawData = [];
        let isSearching = false;
        
        // Pembaruan Hierarki Kolom: Mulai dari JENIS
        const levels = ['Jenis', 'Divisi', 'Sub Divisi', 'Kelas', 'Subkelas', 'Komoditas'];
        let currentPath = []; 

        const listContainer = document.getElementById('listContainer');
        const loading = document.getElementById('loading');
        const breadcrumb = document.getElementById('breadcrumb');
        const breadcrumbText = document.getElementById('breadcrumbText');
        const searchInput = document.getElementById('searchInput');

        async function fetchData() {
            try {
                const response = await fetch(API_URL);
                const json = await response.json();
                if(json.status === 'success') {
                    rawData = json.data;
                    loading.style.display = 'none';
                    renderLevel(); // Render Level 0 (Jenis)
                }
            } catch (error) {
                loading.innerHTML = '<i class="fas fa-wifi text-red-500 text-3xl mb-3"></i><p>Gagal memuat data. Periksa koneksi.</p>';
            }
        }

        function renderLevel() {
            listContainer.innerHTML = '';
            isSearching = false;
            
            let currentDepth = currentPath.length; // 0=Jenis, 1=Divisi, dst.
            
            // UI Breadcrumb
            if(currentDepth === 0) {
                breadcrumb.classList.add('hidden');
                breadcrumb.classList.remove('flex');
            } else {
                breadcrumb.classList.remove('hidden');
                breadcrumb.classList.add('flex');
                breadcrumbText.innerText = currentPath[currentDepth - 1].value;
            }

            let filteredData = rawData;
            for(let i = 0; i < currentDepth; i++) {
                filteredData = filteredData.filter(row => row[levels[i]] === currentPath[i].value);
            }

            // Jika sudah di tahap Subkelas, tampilkan Komoditas
            if(currentDepth === levels.length - 1) {
                renderKomoditasList(filteredData);
                return;
            }

            const currentColumnName = levels[currentDepth];
            const uniqueItems = [...new Set(filteredData.map(item => item[currentColumnName]))].filter(Boolean);

            uniqueItems.forEach((item, idx) => {
                const li = document.createElement('li');
                // Staggered animation delay
                li.style.animationDelay = `${idx * 0.03}s`;
                li.className = 'slide-in opacity-0 hover:bg-gray-50 dark:hover:bg-gray-800/50 transition-colors cursor-pointer p-4 px-5 flex justify-between items-center group';
                
                // Ikon folder untuk hierarki
                let iconClass = currentDepth === 0 ? 'fa-layer-group text-blue-500' : 'fa-folder-open text-amber-500';

                li.innerHTML = `
                    <div class="flex items-start gap-3">
                        <div class="mt-0.5">
                            <i class="fa-solid ${iconClass} text-sm opacity-80"></i>
                        </div>
                        <span class="text-sm font-semibold text-gray-700 dark:text-gray-200 leading-relaxed pr-4">${item}</span>
                    </div>
                    <div class="w-6 h-6 rounded-full bg-gray-100 dark:bg-gray-800 flex items-center justify-center group-hover:bg-brand-100 dark:group-hover:bg-brand-900/50 transition-colors">
                        <i class="fas fa-chevron-right text-gray-400 group-hover:text-brand-500 text-[10px]"></i>
                    </div>
                `;
                li.onclick = () => {
                    currentPath.push({ level: currentColumnName, value: item });
                    searchInput.value = ''; 
                    renderLevel();
                };
                listContainer.appendChild(li);
            });
        }

        function renderKomoditasList(dataToRender) {
            listContainer.innerHTML = '';
            
            const uniqueKomoditas = [];
            const seen = new Set();
            dataToRender.forEach(item => {
                if(!seen.has(item.GEN_KD_SPDT26)) {
                    seen.add(item.GEN_KD_SPDT26);
                    uniqueKomoditas.push(item);
                }
            });

            if(uniqueKomoditas.length === 0) {
                listContainer.innerHTML = `
                    <div class="p-8 text-center text-gray-500 flex flex-col items-center">
                        <i class="fa-solid fa-box-open text-3xl mb-3 opacity-50"></i>
                        <p class="text-sm">Data tidak ditemukan</p>
                    </div>`;
                return;
            }

            uniqueKomoditas.forEach((item, idx) => {
                const li = document.createElement('li');
                li.style.animationDelay = `${idx * 0.03}s`;
                li.className = 'slide-in opacity-0 hover:bg-gray-50 dark:hover:bg-gray-800/50 transition-colors cursor-pointer p-4 px-5 flex flex-col group';
                
                li.innerHTML = `
                    <div class="flex items-start gap-3">
                        <div class="bg-gray-100 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 group-hover:border-brand-500 group-hover:text-brand-600 dark:group-hover:text-brand-400 px-2 py-1 rounded text-xs font-mono text-gray-600 dark:text-gray-300 whitespace-nowrap mt-0.5 transition-colors">
                            ${item.GEN_KD_SPDT26}
                        </div>
                        <div class="text-sm font-medium text-gray-800 dark:text-gray-100 leading-relaxed flex-1">${item.NAMA_KOM_SPDT26}</div>
                    </div>
                `;
                
                li.onclick = () => showDetail(item);
                listContainer.appendChild(li);
            });
        }

        function showDetail(item) {
            listContainer.innerHTML = `
                <div class="p-5 slide-in">
                    <div class="bg-white dark:bg-gray-800 rounded-2xl p-6 border border-gray-100 dark:border-gray-700 shadow-xl shadow-gray-200/50 dark:shadow-none relative">
                        
                        <div class="w-12 h-12 rounded-full bg-brand-100 dark:bg-brand-900/30 text-brand-600 dark:text-brand-400 flex items-center justify-center mb-4">
                            <i class="fa-solid fa-box text-xl"></i>
                        </div>

                        <span class="absolute top-6 right-6 text-[10px] font-bold bg-brand-50 dark:bg-gray-900 text-brand-600 dark:text-brand-400 px-3 py-1.5 rounded-full border border-brand-200 dark:border-gray-700 uppercase tracking-wide">
                            Komoditas
                        </span>
                        
                        <h2 class="text-xl font-bold text-gray-900 dark:text-white mb-6 pr-12 leading-snug">${item.NAMA_KOM_SPDT26}</h2>
                        
                        <div class="grid grid-cols-2 gap-3 mb-6">
                            <div class="bg-gray-50 dark:bg-gray-900/50 p-4 rounded-xl border border-gray-100 dark:border-gray-700/50">
                                <p class="text-[10px] font-semibold text-gray-400 dark:text-gray-500 mb-1 uppercase tracking-wider">Kode SPDT</p>
                                <p class="font-mono text-base font-bold text-gray-800 dark:text-gray-200">${item.GEN_KD_SPDT26}</p>
                            </div>
                            
                            <div class="bg-gray-50 dark:bg-gray-900/50 p-4 rounded-xl border border-gray-100 dark:border-gray-700/50">
                                <p class="text-[10px] font-semibold text-gray-400 dark:text-gray-500 mb-1 uppercase tracking-wider">Satuan</p>
                                <p class="font-bold text-base text-brand-600 dark:text-brand-400">${item.SATUAN || '-'}</p>
                            </div>
                        </div>
                        
                        <!-- Hierarki Detail -->
                        <div class="pt-5 border-t border-gray-100 dark:border-gray-700/80">
                            <h3 class="text-xs font-bold text-gray-900 dark:text-gray-300 mb-3 uppercase tracking-wider">Garis Turunan</h3>
                            <div class="space-y-3 relative before:absolute before:inset-y-0 before:left-[11px] before:w-[2px] before:bg-gray-200 dark:before:bg-gray-700">
                                <DetailRow label="Jenis" value="${item['Jenis']}" />
                                <DetailRow label="Divisi" value="${item['Divisi']}" />
                                <DetailRow label="Sub Divisi" value="${item['Sub Divisi']}" />
                                <DetailRow label="Kelas" value="${item['Kelas']}" />
                                <DetailRow label="Subkelas" value="${item['Subkelas']}" />
                            </div>
                        </div>
                    </div>
                </div>
            `;
            
            // Helper fungsi mengganti markup row timeline 
            listContainer.innerHTML = listContainer.innerHTML.replace(/<DetailRow label="(.*?)" value="(.*?)" \/>/g, 
                `<div class="relative pl-7">
                    <div class="absolute left-0 top-1.5 w-[24px] h-[24px] rounded-full bg-white dark:bg-gray-800 border-2 border-brand-500 z-10 flex items-center justify-center">
                        <div class="w-2 h-2 rounded-full bg-brand-500"></div>
                    </div>
                    <p class="text-xs text-gray-500 dark:text-gray-400 mb-0.5">$1</p>
                    <p class="text-sm font-semibold text-gray-800 dark:text-gray-200">$2</p>
                </div>`
            );

            breadcrumb.classList.remove('hidden');
            breadcrumb.classList.add('flex');
            breadcrumbText.innerText = "Kembali ke Daftar";
        }

        // Live Search Logic
        searchInput.addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase().trim();
            if(query.length === 0) {
                if(isSearching) renderLevel(); 
                return;
            }

            isSearching = true;
            breadcrumb.classList.add('hidden');
            breadcrumb.classList.remove('flex');
            
            const results = rawData.filter(item => {
                const kode = (item.GEN_KD_SPDT26 || '').toLowerCase();
                const nama = (item.NAMA_KOM_SPDT26 || '').toLowerCase();
                return kode.includes(query) || nama.includes(query);
            });

            renderKomoditasList(results);
        });

        // Breadcrumb Click Event (Back button)
        breadcrumb.addEventListener('click', () => {
            if (isSearching) {
                searchInput.value = '';
                renderLevel();
            } else {
                currentPath.pop();
                renderLevel();
            }
        });

        fetchData();
    </script>
</body>
</html>
